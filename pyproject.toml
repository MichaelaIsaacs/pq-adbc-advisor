[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-adbc-advisor"
version = "0.3.3"
description = "Read-only advisor that identifies Fabric / Power BI artifacts affected by the ODBC to ADBC connector migration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Microsoft - Power Query PM" }
]
keywords = ["fabric", "power-bi", "power-query", "adbc", "odbc", "migration"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
sp = ["msal>=1.20", "cryptography>=41"]

[project.urls]
Homepage = "https://github.com/microsoft/pq-adbc-advisor"
Issues = "https://github.com/microsoft/pq-adbc-advisor/issues"

[tool.setuptools.packages.find]
where = ["src"]
